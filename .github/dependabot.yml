version: 2

updates:
  - package-ecosystem: "docker"
    directories:
      - "/octo-deploy-ubuntu"
      - "/octo-deploy-windows"
      # octo-tentacle-ubuntu is not listed: it builds FROM octopusdeploy/tentacle:latest
      # and an ACR task rebuilds it nightly (octo-tentacle-ubuntu/doc/adr/0002).
      - "/ubuntu-chrome"
      - "/windows-chrome"
    schedule:
      interval: "cron"
      cronjob: "0 9 2 * *"
      timezone: "America/Denver"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
      exclude:
        - "@cmnhospitals/*"
    groups:
      patch-updates:
        update-types: ["patch"]
      minor-updates:
        update-types: ["minor"]
      major-updates:
        update-types: ["major"]
